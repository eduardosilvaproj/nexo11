<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS</title>
    <meta name="description" content="NEXUS - Gestão que conecta. Resultado que multiplica.">
    <meta name="author" content="NEXUS" />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="/nexus-logo.png">
    <meta property="og:title" content="NEXUS">
    <meta property="og:description" content="NEXUS - Gestão que conecta. Resultado que multiplica.">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NEXUS">
    <meta name="twitter:description" content="NEXUS - Gestão que conecta. Resultado que multiplica.">
    <meta name="twitter:image" content="/nexus-logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    
    <meta name="theme-color" content="#1a9be8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>

  <body>
    <div id="root">
      <div id="nexus-fallback" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0e1a;color:#94a3b8;font-family:system-ui,sans-serif;z-index:99999;">
        <div style="text-align:center;padding:24px;">
          <div style="width:48px;height:48px;border:3px solid #1e293b;border-top-color:#1a9be8;border-radius:50%;margin:0 auto 16px;animation:spin 1s linear infinite;"></div>
          <p style="margin:0;font-size:14px;">Carregando Nexus...</p>
          <style>@@keyframes spin{to{transform:rotate(360deg)}}</style>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove fallback after React mounts
      window.addEventListener('load', () => {
        setTimeout(() => {
          const fb = document.getElementById('nexus-fallback');
          if (fb) fb.remove();
        }, 100);
      });
    </script>
  </body>
</html>
